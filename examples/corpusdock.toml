[corpus]
name = "my-local-corpus"
data_dir = "data"

[embedding]
# The default implementation must stay local. Hosted providers are explicit opt-in.
provider = "local"

[retrieval]
full_text = true
# Build the opt-in local vector index with `corpusdock embed` before enabling this.
semantic = false
max_results = 10

[privacy]
allow_cloud_content = false
