[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corpusdock"
version = "0.8.0"
description = "Citation-aware local document ingestion and retrieval for AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CorpusDock contributors" },
]
keywords = ["citation", "documents", "ingestion", "rag", "retrieval", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local-models = [
    "wtpsplit-lite>=0.2,<1",
]
local-models-cuda = [
    "wtpsplit[onnx-gpu]>=2.2,<3",
]
semantic = [
    "sentence-transformers>=5.4,<6",
]
analysis = [
    "lm-format-enforcer>=0.11,<1",
    "torch>=2.8",
    "transformers>=5.5,<6",
    "wtpsplit-lite>=0.2,<1",
]
analysis-cuda = [
    "accelerate>=1.12,<2",
    "bitsandbytes>=0.49,<1",
]
analysis-vllm = [
    "vllm>=0.27,<0.28",
    "wtpsplit[onnx-gpu]>=2.2,<3",
]

[tool.uv]
conflicts = [
    [
        { extra = "local-models" },
        { extra = "local-models-cuda" },
    ],
    [
        { extra = "local-models" },
        { extra = "analysis-vllm" },
    ],
]

[project.scripts]
corpusdock = "corpusdock.cli:main"

[tool.hatch.build]
exclude = [
    "/.corpusdock",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/DOCS",
    "/_scratch",
    "/data/extracted",
    "/data/indexes",
    "/data/originals",
    "/data/postgres",
    "/docs",
    "/models",
]

[tool.hatch.build.targets.sdist]
# An explicit release allowlist prevents ignored local notes and corpora from being
# copied into a source archive when they exist in the working tree.
only-include = [
    ".env.example",
    ".gitattributes",
    ".github",
    ".python-version",
    "README.md",
    "benchmarks",
    "data/README.md",
    "examples",
    "src",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corpusdock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
